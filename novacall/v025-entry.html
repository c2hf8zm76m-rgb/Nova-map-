<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a13">
  <title>NovaCall V0.25</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#070a13;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #nc25boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(103,92,238,.22),transparent 36%),#070a13;transition:opacity .22s ease}
    #nc25boot.out{opacity:0;pointer-events:none}
    .nc25box{text-align:center;padding:28px}.nc25logo{width:72px;height:72px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,#776cff,#4d82ff);font-size:30px;font-weight:950;box-shadow:0 20px 70px rgba(77,82,255,.32)}
    .nc25box b{display:block;font-size:22px;letter-spacing:-.35px}.nc25box span{display:block;margin-top:7px;color:#8f9bb0;font-size:11px}.nc25bar{width:132px;height:4px;margin:18px auto 0;border-radius:999px;background:#151b29;overflow:hidden}.nc25bar i{display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#776cff,#9d95ff,#4d82ff);animation:nc25load 1.05s ease-in-out infinite}@keyframes nc25load{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}
    #nc25error{display:none;max-width:420px;margin:16px auto 0;color:#ff9cae;font-size:11px;line-height:1.45}
  </style>
</head>
<body>
  <div id="nc25boot"><div class="nc25box"><div class="nc25logo">N</div><b>NovaCall</b><span id="nc25status">Ouverture V0.25…</span><div class="nc25bar"><i></i></div><div id="nc25error"></div></div></div>
  <script>
  (()=>{
    'use strict';
    const VERSION='0.25';
    const UPSTREAM='https://nova-call-pfm160352-alo12230-6256s-projects.vercel.app';
    const boot=document.getElementById('nc25boot');
    const status=document.getElementById('nc25status');
    const errorBox=document.getElementById('nc25error');
    let done=false;

    function setStatus(t){ if(status) status.textContent=t; }
    function reveal(){
      if(done)return;done=true;
      boot?.classList.add('out');
      setTimeout(()=>boot?.remove(),260);
    }
    function fail(msg){
      done=true;
      document.title='NovaCall V0.25';
      if(status)status.textContent='NovaCall n’a pas pu s’ouvrir';
      if(errorBox){errorBox.style.display='block';errorBox.textContent=String(msg||'Erreur inconnue')}
    }
    async function clearLegacyPWA(){
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.allSettled(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.allSettled(keys.filter(k=>/nova.?call/i.test(k)).map(k=>caches.delete(k)));
        }
      }catch(e){console.warn('NovaCall V0.25 PWA cleanup',e)}
    }
    function patch(html){
      // Stop the V0.24.x theme observer from writing into the same DOM it observes.
      html=html.replace(
        /new MutationObserver\(\(\)=>\{fix\(\);if\(document\.body&&!document\.querySelector\('#ncTheme2412'\)\)ensure\(\)\}\)\.observe\(document\.documentElement,\{subtree:true,childList:true,characterData:true\}\);fix\(\)/,
        'fix()'
      );
      html=html.replace(
        /new MutationObserver\(fix\)\.observe\(document\.documentElement,\{subtree:true,childList:true,characterData:true\}\);/g,
        ''
      );
      html=html.replaceAll('NovaCall V0.24.13','NovaCall V0.25');
      html=html.replaceAll('NovaCall V0.24.12','NovaCall V0.25');
      html=html.replaceAll("const V='0.24.13'","const V='0.25'");
      html=html.replaceAll("const V='0.24.12'","const V='0.25'");
      html=html.replace(/>V0\.(?:1[6-9]|2[0-4])(?:\.\d+)*</g,'>V0.25<');
      html=html.replace(/>0\.(?:1[6-9]|2[0-4])(?:\.\d+)*</g,'>0.25<');

      const guard=`<script id="nc25runtime">(()=>{if(window.__nc25)return;window.__nc25=1;document.title='NovaCall V0.25';const rawFetch=window.fetch.bind(window);window.fetch=(input,init={})=>{let u='';try{u=typeof input==='string'?input:(input&&input.url)||''}catch{}if(u.includes('nova-call-signal.vercel.app/api/signal')&&!init.signal){const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);return rawFetch(input,{...init,signal:c.signal}).finally(()=>clearTimeout(t))}return rawFetch(input,init)};const keep=()=>{document.title='NovaCall V0.25';document.querySelectorAll('.brand .v,.v16-brandname span,.nc20-brand small,[class*=version]').forEach(e=>{if(e.children?.length)return;const t=(e.textContent||'').trim();if(/^V?0\\.(?:16|17|18|19|20|21|22|23|24)(?:\\.\\d+)*$/i.test(t))e.textContent=t[0]?.toUpperCase()==='V'?'V0.25':'0.25'})};document.addEventListener('DOMContentLoaded',keep,{once:true});setTimeout(keep,50);setTimeout(keep,600);setTimeout(keep,1800)})();<\/script>`;
      html=html.replace('</head>',guard+'</head>');
      return html;
    }

    async function boot25(){
      try{
        setStatus('Nettoyage des anciennes versions…');
        await Promise.race([clearLegacyPWA(),new Promise(r=>setTimeout(r,1200))]);
        setStatus('Chargement du moteur NovaCall…');
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(),10000);
        const target=UPSTREAM+location.pathname+location.search;
        const r=await fetch(target,{cache:'no-store',signal:controller.signal});
        clearTimeout(timer);
        if(!r.ok)throw new Error('Serveur NovaCall HTTP '+r.status);
        let html=await r.text();
        html=patch(html);
        setStatus('Finalisation V0.25…');
        const safety=`<script>(()=>{const finish=()=>{document.title='NovaCall V0.25';parent===window&&setTimeout(()=>{},0)};window.addEventListener('load',finish,{once:true});setTimeout(finish,2500)})();<\/script>`;
        html=html.replace('</body>',safety+'</body>');
        document.open();document.write(html);document.close();
      }catch(e){
        console.error('NovaCall V0.25 boot',e);
        fail(e?.name==='AbortError'?'Chargement trop long : NovaCall a arrêté proprement la tentative.':e?.message||e);
      }
    }

    // Never leave the user on an infinite spinner.
    setTimeout(()=>{if(!done&&document.getElementById('nc25boot'))fail('Le chargement a dépassé la limite de sécurité.')},12500);
    boot25();
  })();
  </script>
</body>
</html>
