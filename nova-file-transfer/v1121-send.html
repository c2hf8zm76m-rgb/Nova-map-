<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>NOVA Transfer V1.1.21 — Téléphone vers PC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06101d}
.boot{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:#06101d;color:#eef5ff;text-align:center;padding:24px}
.boot.hide{display:none}.boot b{font-size:21px}.boot span{display:block;margin-top:7px;color:#91a4c3;font-size:12px}
.handoff{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:rgba(3,8,18,.91);backdrop-filter:blur(18px);color:#eef7ff}
.handoff.hidden{display:none}
.card{width:min(520px,calc(100vw - 28px));padding:30px 22px 24px;border:1px solid rgba(85,230,255,.18);border-radius:28px;background:radial-gradient(circle at 50% 0,rgba(85,230,255,.13),transparent 35%),linear-gradient(180deg,#12233c,#09162a);box-shadow:0 35px 100px #0009;text-align:center}
.arrow{font-size:49px;line-height:1;margin-bottom:10px}.tag{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;border:1px solid rgba(83,237,178,.2);background:rgba(83,237,178,.06);color:#d7ffef;font-size:9px;font-weight:900;letter-spacing:.1em}.tag i{width:8px;height:8px;border-radius:50%;background:#53edb2;box-shadow:0 0 12px #53edb2}
h1{margin:14px 0 9px;font-size:clamp(34px,10vw,52px);line-height:.95;letter-spacing:-.055em}h1 em{font-style:normal;color:#55e6ff}
.lead{margin:0 auto;color:#a0b1cc;font-size:14px;line-height:1.55;max-width:410px}.lead b{color:#fff}
.file{margin-top:17px;padding:14px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff10;text-align:left;min-width:0}.file span{display:block;color:#8196b7;font-size:8px;font-weight:900;letter-spacing:.12em}.file strong{display:block;margin-top:5px;font-size:13px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.file small{display:block;margin-top:4px;color:#90a4c3;font-size:10px}
.go{width:100%;min-height:56px;margin-top:17px;border:0;border-radius:16px;background:#eef9ff;color:#071421;font-size:14px;font-weight:950}.hint{margin-top:10px;color:#7188aa;font-size:10px;line-height:1.45}
</style>
</head>
<body>
<iframe id="sender" class="frame" title="NOVA Transfer"></iframe>
<div id="boot" class="boot"><div><b>NOVA Transfer V1.1.21</b><span>Connexion au PC…</span></div></div>
<div id="handoff" class="handoff hidden">
  <div class="card">
    <div class="tag"><i></i>FICHIERS PRÊTS</div>
    <div class="arrow">📱 → 💻</div>
    <h1>Va sur <em>ton PC.</em></h1>
    <p class="lead">Ton fichier est prêt, mais le transfert <b>ne démarre qu’après ton acceptation sur le PC.</b></p>
    <div class="file"><span>SÉLECTION EN ATTENTE</span><strong id="fileName">—</strong><small id="fileInfo">—</small></div>
    <button id="goPc" class="go" type="button">OK, je vais sur mon PC</button>
    <div class="hint">Sur le PC, NOVA affiche maintenant une grande fenêtre « Accepter et commencer ».</div>
  </div>
</div>
<script>
(()=>{'use strict';
const frame=document.getElementById('sender'),boot=document.getElementById('boot'),handoff=document.getElementById('handoff');
const peer=(location.hash||'').replace(/^#/,'').trim();
if(!/^nova-file-[a-f0-9]{36}$/i.test(peer)){boot.innerHTML='<div><b>QR NOVA invalide</b><span>Recrée le QR sur le PC.</span></div>';return}
let dismissedKey='';
function evaluate(d){
  const status=(d.getElementById('st')?.textContent||'').trim();
  const title=(d.getElementById('pt')?.textContent||'').trim();
  const info=(d.getElementById('pi')?.textContent||'').trim();
  const progress=d.getElementById('progress');
  const sending=progress&&!progress.classList.contains('hidden');
  const key=title+'|'+info;
  if(sending||/Transfert en cours|Reprise/i.test(status)){
    handoff.classList.add('hidden');
    dismissedKey='';
    return;
  }
  if(status==='Sélection envoyée au PC'&&title&&title!=='Choisis tes fichiers'&&key!==dismissedKey){
    document.getElementById('fileName').textContent=title;
    document.getElementById('fileInfo').textContent=info||'En attente de validation sur le PC';
    handoff.classList.remove('hidden');
  }
}
document.getElementById('goPc').addEventListener('click',()=>{
  const d=frame.contentDocument;
  dismissedKey=((d?.getElementById('pt')?.textContent||'').trim())+'|'+((d?.getElementById('pi')?.textContent||'').trim());
  handoff.classList.add('hidden');
});
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)throw new Error();
    const label=d.querySelector('.brand span');if(label)label.textContent='TÉLÉPHONE → PC · BIDIRECTIONNEL · V1.1.21';
    let queued=false;
    const obs=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;evaluate(d)})});
    obs.observe(d.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
    evaluate(d);
    setTimeout(()=>boot.classList.add('hide'),80);
  }catch(e){boot.innerHTML='<div><b>Erreur de chargement</b><span>Recharge la page et rescane le QR.</span></div>'}
},{once:true});
frame.src='https://htmlpreview.github.io/?https://github.com/c2hf8zm76m-rgb/Nova-map-/blob/main/nova-file-transfer/v1119-send.html#'+encodeURIComponent(peer);
})();
</script>
</body>
</html>
