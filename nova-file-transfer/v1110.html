<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>NOVA Transfer V1.1.10</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d;color:#eef5ff;font-family:Inter,system-ui,sans-serif}.wrap{position:fixed;inset:0;background:#06101d}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#06101d}.boot{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 85% 0,#243d83 0,transparent 34%),linear-gradient(160deg,#06101c,#081226 60%,#070c17);z-index:2}.boot.hide{display:none}.logo{width:62px;height:62px;margin:auto;display:grid;place-items:center;border-radius:20px;background:linear-gradient(145deg,#7d73ff,#4ddcff);font-size:28px;font-weight:900;box-shadow:0 0 36px #58cfff40}.boot b{display:block;margin-top:16px;font-size:22px}.boot span{display:block;margin-top:8px;color:#96a7c4;font-size:13px;line-height:1.5}.err{color:#ff9fa8!important}</style></head><body><div class="wrap"><iframe id="receiver" class="frame" title="NOVA Transfer"></iframe><div id="boot" class="boot"><div><div class="logo">N</div><b>NOVA Transfer V1.1.10</b><span id="bootText">Chargement du moteur mobile stable…</span></div></div></div><script>(()=>{'use strict';const boot=document.getElementById('boot'),txt=document.getElementById('bootText'),frame=document.getElementById('receiver');const peer=(location.hash||'').replace(/^#/,'').trim();if(!/^nova-file-[a-f0-9]{36}$/i.test(peer)){txt.textContent='QR NOVA invalide.';txt.className='err';return}const base='https://htmlpreview.github.io/?https://github.com/c2hf8zm76m-rgb/Nova-map-/blob/main/nova-file-transfer/v118.html#';let loaded=false;const watchdog=setTimeout(()=>{if(!loaded){txt.textContent='Le moteur ne répond pas. Recharge la page ou rescane le QR.';txt.className='err'}},12000);frame.addEventListener('load',()=>{loaded=true;clearTimeout(watchdog);try{const w=frame.contentWindow,d=frame.contentDocument;if(w&&w.URL)w.URL.revokeObjectURL=()=>{};const style=d.createElement('style');style.textContent='.done{align-items:flex-start!important;min-width:0}.done>div:last-child{min-width:0;flex:1}.done strong,.done small{white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important}.download-item{align-items:flex-start!important;flex-wrap:wrap!important;min-width:0}.download-item strong{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:anywhere!important;word-break:break-word!important;line-height:1.35}.download-item a{white-space:nowrap;max-width:100%}@media(max-width:520px){.download-item{display:grid!important;grid-template-columns:34px minmax(0,1fr)!important}.download-item a{grid-column:1/-1;width:100%;text-align:center}}';d.head.appendChild(style);const brand=d.querySelector('.brand span');if(brand)brand.textContent='P2P DIRECT · ULTRA LARGE · V1.1.10';d.title='NOVA Transfer V1.1.10';setTimeout(()=>boot.classList.add('hide'),80)}catch(e){txt.textContent='Le receiver est chargé mais le correctif mobile n’a pas pu être appliqué.';txt.className='err'}},{once:true});frame.src=base+encodeURIComponent(peer)})();</script></body></html>
