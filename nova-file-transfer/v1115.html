<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>NOVA Transfer V1.1.15</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101d}
.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06101d}
.boot{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#06101d;color:#eef5ff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
.boot.hide{display:none}
.boot b{font-size:22px}.boot span{display:block;margin-top:8px;color:#96a7c4;font-size:13px}
</style>
</head>
<body>
<iframe id="receiver" class="frame" title="NOVA Transfer"></iframe>
<div id="boot" class="boot"><div><b>NOVA Transfer V1.1.15</b><span>Chargement de la mise en page mobile…</span></div></div>
<script>
(()=>{'use strict';
const frame=document.getElementById('receiver'),boot=document.getElementById('boot');
const peer=(location.hash||'').replace(/^#/,'').trim();
if(!/^nova-file-[a-f0-9]{36}$/i.test(peer)){
  boot.innerHTML='<div><b>QR NOVA invalide</b><span>Recrée un QR depuis NOVA File.</span></div>';
  return;
}
function force(el,props){
  if(!el)return;
  for(const [k,v] of Object.entries(props)) el.style.setProperty(k,v,'important');
}
function applyFix(d){
  let style=d.getElementById('nova-v1115-style');
  if(!style){style=d.createElement('style');style.id='nova-v1115-style';d.head.appendChild(style)}
  style.textContent=`
html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
body{padding-left:10px!important;padding-right:10px!important}
main{width:100%!important;max-width:720px!important;min-width:0!important;margin-left:auto!important;margin-right:auto!important}
.hero,.features,.card,#fileCard,#doneCard,.file-list,.download-list,.batch,.done,.file-row,.download-item{
  width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important
}
#fileCard,#doneCard{overflow:hidden!important}
.batch{
  display:grid!important;
  grid-template-columns:58px minmax(0,1fr)!important;
  gap:14px!important;
  align-items:start!important
}
.batch>div:last-child,.file-row>div,.download-item>div,.done>div:last-child{
  min-width:0!important;max-width:100%!important;width:100%!important
}
.batch strong,.batch small,
.file-row strong,.file-row small,
.download-item strong,.download-item small,
.done strong,.done small,
.current-file,.progress-title strong{
  display:block!important;
  max-width:100%!important;
  white-space:normal!important;
  overflow:visible!important;
  text-overflow:clip!important;
  overflow-wrap:anywhere!important;
  word-break:break-word!important
}
.file-list{display:grid!important;gap:8px!important;overflow:hidden!important}
.file-row{
  display:grid!important;
  grid-template-columns:44px minmax(0,1fr)!important;
  gap:10px!important;
  align-items:start!important;
  overflow:hidden!important
}
.file-row>b{grid-column:1!important;width:44px!important;min-width:44px!important}
.file-row>div{grid-column:2!important}
.file-row strong{line-height:1.35!important}
.file-row small{margin-top:4px!important;line-height:1.35!important}
.done{
  display:grid!important;
  grid-template-columns:46px minmax(0,1fr)!important;
  gap:12px!important;
  align-items:start!important
}
.download-list{display:block!important;overflow:hidden!important}
.download-item{
  display:grid!important;
  grid-template-columns:40px minmax(0,1fr)!important;
  grid-template-rows:auto auto!important;
  gap:10px!important;
  align-items:start!important;
  overflow:hidden!important;
  margin-top:10px!important
}
.download-item>b{grid-column:1!important;grid-row:1!important}
.download-item>div{grid-column:2!important;grid-row:1!important}
.download-item>a{
  grid-column:1/-1!important;grid-row:2!important;
  display:flex!important;width:100%!important;max-width:100%!important;min-width:0!important;
  justify-content:center!important;text-align:center!important;white-space:normal!important;margin:0!important
}
.meta{flex-wrap:wrap!important;min-width:0!important}
@media(max-width:520px){
  .hero,.card{padding-left:16px!important;padding-right:16px!important}
  .batch{grid-template-columns:54px minmax(0,1fr)!important}
  .file-row{grid-template-columns:40px minmax(0,1fr)!important}
  .file-row>b{width:40px!important;min-width:40px!important}
  .done{grid-template-columns:42px minmax(0,1fr)!important}
  .download-item{grid-template-columns:38px minmax(0,1fr)!important}
}
`;
  const fileCard=d.getElementById('fileCard');
  force(fileCard,{'width':'100%','max-width':'100%','min-width':'0','overflow':'hidden'});
  const batch=d.querySelector('#fileCard .batch');
  force(batch,{'display':'grid','grid-template-columns':'58px minmax(0,1fr)','width':'100%','max-width':'100%','min-width':'0'});
  for(const row of d.querySelectorAll('#fileCard .file-row')){
    force(row,{'display':'grid','grid-template-columns':'44px minmax(0,1fr)','width':'100%','max-width':'100%','min-width':'0','overflow':'hidden'});
    const txt=row.querySelector('div');
    force(txt,{'min-width':'0','max-width':'100%','width':'100%'});
    for(const el of row.querySelectorAll('strong,small')){
      force(el,{'display':'block','max-width':'100%','white-space':'normal','overflow':'visible','text-overflow':'clip','overflow-wrap':'anywhere','word-break':'break-word'});
    }
  }
  const done=d.querySelector('#doneCard .done');
  force(done,{'display':'grid','grid-template-columns':'46px minmax(0,1fr)','width':'100%','max-width':'100%','min-width':'0'});
  for(const row of d.querySelectorAll('#downloadList .download-item')){
    force(row,{'display':'grid','grid-template-columns':'40px minmax(0,1fr)','grid-template-rows':'auto auto','width':'100%','max-width':'100%','min-width':'0','overflow':'hidden'});
    const txt=row.querySelector('div');
    force(txt,{'min-width':'0','max-width':'100%','width':'100%'});
    for(const el of row.querySelectorAll('strong,small')){
      force(el,{'display':'block','max-width':'100%','white-space':'normal','overflow-wrap':'anywhere','word-break':'break-word'});
    }
    const a=row.querySelector('a');
    force(a,{'grid-column':'1/-1','grid-row':'2','width':'100%','max-width':'100%','justify-content':'center','text-align':'center'});
  }
}
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    if(!d)throw new Error('document inaccessible');
    applyFix(d);
    let queued=false;
    const obs=new MutationObserver(()=>{
      if(queued)return;
      queued=true;
      requestAnimationFrame(()=>{queued=false;applyFix(d)});
    });
    obs.observe(d.documentElement,{subtree:true,childList:true,characterData:true});
    const label=d.querySelector('.brand span');
    if(label)label.textContent='P2P DIRECT · ULTRA LARGE · V1.1.15';
    d.title='NOVA Transfer V1.1.15';
    setTimeout(()=>boot.classList.add('hide'),80);
  }catch(e){
    boot.innerHTML='<div><b>Erreur de mise en page</b><span>Recharge la page et rescane le QR.</span></div>';
  }
},{once:true});
frame.src='https://htmlpreview.github.io/?https://github.com/c2hf8zm76m-rgb/Nova-map-/blob/main/nova-file-transfer/v118.html#'+encodeURIComponent(peer);
})();
</script>
</body>
</html>
